global:
  scrape_interval: 15s
scrape_configs:
  # node_exporter's textfile collector serves every server's depmap.prom from the shared volume.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  # OBI on the kind nodes of dev/hybrid.sh, on their old-data-centre addresses. Down until it runs.
  - job_name: obi
    static_configs:
      - targets: ["10.1.8.10:9400", "10.1.8.11:9400", "10.1.8.12:9400"]
